name: research plugins
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . ./plugins/research build
      - run: python -m unittest discover -s tests -v
        working-directory: plugins/research
      - run: python -m build
        working-directory: plugins/research
