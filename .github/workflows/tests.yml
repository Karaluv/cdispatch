name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - name: Installed wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/cdispatch-wheel
          /tmp/cdispatch-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cdispatch-wheel/bin/cdispatch --help
          /tmp/cdispatch-wheel/bin/cdispatch --config /tmp/cdispatch-smoke.json init --owner alice --account lab --partition cpu
          /tmp/cdispatch-wheel/bin/cdispatch --config /tmp/cdispatch-smoke.json check-config
