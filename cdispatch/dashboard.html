<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Очередь расчётов</title>
<style>body{font:15px system-ui;background:#111827;color:#e5e7eb;margin:24px}h1{font-size:24px}section{margin:24px 0}table{border-collapse:collapse;width:100%;background:#1f2937}td,th{text-align:left;padding:10px;border-bottom:1px solid #374151}th{color:#9ca3af}input{background:#1f2937;color:white;border:1px solid #64748b;padding:10px;min-width:340px}small{color:#9ca3af}a{color:#93c5fd}.ok{color:#6ee7b7}.bad{color:#fca5a5}pre{white-space:pre-wrap}#summary{display:flex;gap:15px;flex-wrap:wrap}.card{background:#1f2937;padding:18px;border-radius:8px}.scroll{overflow:auto}progress{width:100px}</style>
<h1>Очередь расчётов</h1><p id="health">Загрузка…</p><div id="summary"></div>
<section><input id="filter" placeholder="Проект, цель, этап, ID, состояние…"><small> Обновление интерфейса 2 с; Slurm — 10 с</small><div class="scroll"><table><thead><tr><th>Подпись / ID</th><th>Приоритет</th><th>Состояние / причина</th><th>Ресурсы</th><th>Slurm / ноды / лог</th></tr></thead><tbody id="tasks"></tbody></table></div></section>
<section><h2>Ноды</h2><div class="scroll"><table><thead><tr><th>Нода / состояние</th><th>CPU занято / всего</th><th>Память GiB занято / всего</th><th>GPU</th><th>Причина недоступности</th></tr></thead><tbody id="nodes"></tbody></table></div></section>
<section><h2>События</h2><pre id="events"></pre></section>
<script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;
function render(d){data=d;const age=(Date.now()/1000-d.heartbeat).toFixed(0);document.querySelector('#health').textContent=`Снимку ${age} с. ${age>30?'Контроллер не обновляется. ':''}${d.error||d.circuit|| (d.paused?'Отправка приостановлена':'Контроллер работает')}`;
const tasks=Object.values(d.tasks||{});const live=tasks.filter(t=>['RUNNING','PENDING','CONFIGURING'].includes(t.state));const cpu=live.reduce((n,t)=>{const p=t.selection?.profile;return n+(p?p.nodes*p.ranks_per_node*p.threads:0)},0);const hours=(d.accounting||[]).filter(r=>!r.id.includes('.')).reduce((n,r)=>n+Number(r.cpu_seconds||0)/3600,0);
document.querySelector('#summary').innerHTML=[['В очереди',tasks.filter(t=>t.state==='QUEUED').length],['Активных',live.length],['CPU под задачами',cpu],['CPU·ч (выделено, весь пул)',hours.toFixed(1)],['Сбоев',d.counters?.FAILED||0],['Внешних отмен',d.counters?.external_cancellations||0]].map(([k,v])=>`<div class="card"><small>${esc(k)}</small><br><b>${esc(v)}</b></div>`).join('');
const filter=document.querySelector('#filter').value.toLowerCase();document.querySelector('#tasks').innerHTML=tasks.filter(t=>JSON.stringify(t).toLowerCase().includes(filter)).sort((a,b)=>b.spec.priority-a.spec.priority).map(t=>{const l=t.spec.labels||{},p=t.selection?.profile||{};return `<tr><td><b>${esc(l.project||t.spec.name)}</b><br>${esc(l.purpose||'')} / ${esc(l.stage||'')}<br><small>${esc(l.owner||'')} · ${esc(t.id)} · ${esc(t.spec.group)}</small></td><td>${t.spec.priority}</td><td>${esc(t.state)}<br><small>${esc(t.reason)}</small></td><td>${p.nodes?`${p.nodes} × ${p.ranks_per_node*p.threads} CPU, ${(t.selection.mem_mib/1024).toFixed(1)} GiB/node`:''}<br>${esc(p.name||'')} ${p.gpus_per_node?`${p.gpus_per_node} × ${esc(p.gpu_type)}`:''}</td><td>${esc(t.job_id||'')}<br>${esc(t.selection?.nodes?.join(', ')||'')}<br>${t.attempt?`<a href="attempts/${encodeURIComponent(t.id)}/${t.attempts.length}/application.log">лог</a>`:''}</td></tr>`}).join('');
document.querySelector('#nodes').innerHTML=(d.snapshot?.nodes||[]).map(n=>`<tr><td>${esc(n.NodeName)}<br><small>${esc(n.State)}</small></td><td>${esc(n.CPUAlloc)} / ${esc(n.CPUTot)} <progress value="${Number(n.CPUAlloc)}" max="${Number(n.CPUTot)}"></progress></td><td>${(Number(n.AllocMem)/1024).toFixed(1)} / ${(Number(n.RealMemory)/1024).toFixed(1)}</td><td>${esc(n.Gres)}<br><small>${esc(n.AllocTRES)}</small></td><td>${esc(n.Reason||'')}</td></tr>`).join('');
document.querySelector('#events').textContent=(d.events||[]).slice(-30).reverse().map(e=>new Date(e.time*1000).toLocaleString()+' '+e.kind+' '+(e.task||'')+' '+JSON.stringify(e)).join('\n');}
async function update(){try{const r=await fetch('status.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){document.querySelector('#health').textContent='Нет снимка контроллера: '+e.message}}
document.querySelector('#filter').addEventListener('input',()=>data&&render(data));update();setInterval(update,2000);
</script></html>
